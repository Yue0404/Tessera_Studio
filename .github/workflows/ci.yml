name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, wsl]
    steps:
      - uses: actions/checkout@v4
      - name: 校验自托管运行器 Node 与 pnpm
        shell: bash
        run: |
          set -euo pipefail
          node_major="$(node --version | sed -E 's/^v([0-9]+).*/\1/')"
          pnpm_version="$(pnpm --version)"
          if [[ "$node_major" != "24" ]]; then
            echo "::error::自托管运行器需要 Node 24，实际为 $(node --version)"
            exit 1
          fi
          if [[ "$pnpm_version" != "11.4.0" ]]; then
            echo "::error::自托管运行器需要 pnpm 11.4.0，实际为 $pnpm_version"
            exit 1
          fi
          echo "Node $(node --version) / pnpm $pnpm_version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e --workers=1
      - name: 上传 Playwright 失败诊断制品
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
